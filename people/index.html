<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team | Manufacturing and Intelligent Systems (MIS) Lab</title>
    <meta name="description" content="Meet the team at the Manufacturing and Intelligent Systems (MIS) Lab, University of Guelph." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/styles.css" />

    <style>
      /* ─── Variables (matches index.html light theme) ─────────── */
      :root {
        --color-bg: #ffffff;
        --color-surface: #f8fafc;
        --color-surface-2: #f1f5f9;
        --color-border: rgba(0,0,0,0.08);
        --color-text: #0f172a;
        --color-muted: #64748b;
        --color-accent: #2563eb;
        --color-accent-2: #0891b2;
        --color-gold: #d97706;
        --radius: 14px;
        --radius-sm: 8px;
        --font: 'Plus Jakarta Sans', sans-serif;
        --transition: 0.25s ease;
        --nav-h: 84px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: var(--font); background: var(--color-bg); color: var(--color-text); line-height: 1.6; overflow-x: hidden; }
      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; display: block; }

      /* ─── NAV ─────────────────────────────────────────────────── */
      .nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        height: var(--nav-h);
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--color-border);
      }
      .nav__container {
        max-width: 1200px; margin: 0 auto; padding: 0 24px;
        height: 100%; display: flex; align-items: center; justify-content: space-between;
      }
      .nav__logo {
        display: flex; align-items: center; gap: 10px;
        font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; color: var(--color-text);
      }
      .nav__logo-icon {
        width: 34px; height: 34px;
        background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2));
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
      }
      .nav__logo-icon svg { width: 18px; height: 18px; }
      .nav__logo-img { height: 36px; width: auto; object-fit: contain; flex-shrink: 0; }
      .nav__links { display: flex; align-items: center; gap: 4px; list-style: none; }
      .nav__link {
        padding: 7px 14px; border-radius: var(--radius-sm);
        font-size: 0.875rem; font-weight: 500; color: var(--color-muted);
        transition: color var(--transition), background var(--transition);
      }
      .nav__link:hover { color: var(--color-text); background: rgba(0,0,0,0.05); }
      .nav__link--active { color: var(--color-text); font-weight: 600; }
      .nav__link--cta {
        background: var(--color-accent); color: #fff; padding: 7px 16px;
      }
      .nav__link--cta:hover { background: #1d4ed8; color: #fff; }

      /* ─── PAGE HEADER ─────────────────────────────────────────── */
      .page-header {
        padding-top: calc(var(--nav-h) + 60px);
        padding-bottom: 60px;
        padding-left: 24px; padding-right: 24px;
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
        text-align: center;
      }
      .page-header__label {
        display: inline-block;
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--color-accent);
        background: rgba(37,99,235,0.07); border: 1px solid rgba(37,99,235,0.15);
        padding: 5px 14px; border-radius: 100px; margin-bottom: 14px;
      }
      .page-header__title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px;
      }
      .page-header__desc { font-size: 1rem; color: var(--color-muted); max-width: 520px; margin: 0 auto; }

      /* ─── SECTIONS ────────────────────────────────────────────── */
      .people-section { padding: 72px 24px; }
      .people-section + .people-section { padding-top: 0; }
      .section-inner { max-width: 1200px; margin: 0 auto; }

      .section-divider {
        display: flex; align-items: center; gap: 16px;
        margin-bottom: 40px;
      }
      .section-divider__title {
        font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em;
        white-space: nowrap; color: var(--color-text);
      }
      .section-divider__line {
        flex: 1; height: 1px; background: var(--color-border);
      }
      .section-divider__count {
        font-size: 0.78rem; font-weight: 600; color: var(--color-muted);
        background: var(--color-surface-2); border: 1px solid var(--color-border);
        padding: 3px 10px; border-radius: 100px; white-space: nowrap;
      }

      /* ─── PI CARD ─────────────────────────────────────────────── */
      .pi-card {
        background: #ffffff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        padding: 40px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        display: grid;
        grid-template-columns: 200px 1fr auto;
        gap: 40px;
        align-items: start;
        transition: box-shadow var(--transition);
      }
      .pi-card:hover { box-shadow: 0 8px 40px rgba(37,99,235,0.1); }

      .pi-card__photo {
        width: 200px; height: 200px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--color-border);
        background: var(--color-surface-2);
        flex-shrink: 0;
      }
      .pi-card__photo img {
        width: 100%; height: 100%; object-fit: cover;
      }
      .pi-card__photo-placeholder {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-size: 3rem; color: var(--color-muted);
        background: var(--color-surface);
      }

      .pi-card__main { display: flex; flex-direction: column; gap: 16px; }
      .pi-card__name {
        font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;
      }
      .pi-card__role {
        font-size: 0.9rem; color: var(--color-accent); font-weight: 600;
        display: flex; flex-direction: column; gap: 2px;
      }
      .pi-card__role span { font-size: 0.85rem; color: var(--color-muted); font-weight: 500; }
      .pi-card__links { display: flex; gap: 8px; flex-wrap: wrap; }
      .pi-card__link {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 0.8rem; font-weight: 600; color: var(--color-muted);
        border: 1px solid var(--color-border); padding: 6px 12px;
        border-radius: var(--radius-sm);
        transition: all var(--transition);
      }
      .pi-card__link:hover { color: var(--color-accent); border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.05); }
      .pi-card__link svg { width: 13px; height: 13px; }

      .pi-card__edu { display: flex; flex-direction: column; gap: 6px; }
      .pi-card__edu-item {
        display: flex; align-items: baseline; gap: 8px;
        font-size: 0.85rem; color: var(--color-muted);
      }
      .pi-card__edu-item strong { color: var(--color-text); font-weight: 600; font-size: 0.83rem; }

      .pi-card__awards { border-left: 3px solid rgba(37,99,235,0.2); padding-left: 16px; }
      .pi-card__awards-title {
        font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--color-gold); margin-bottom: 10px;
      }
      .pi-card__award-item {
        display: flex; align-items: baseline; gap: 8px;
        font-size: 0.82rem; color: var(--color-muted); padding: 3px 0;
      }
      .pi-card__award-item::before {
        content: '→'; color: var(--color-gold); font-size: 0.7rem; flex-shrink: 0;
      }

      /* ─── GRAD STUDENTS GRID ──────────────────────────────────── */
      .members-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }

      .member-card {
        background: #ffffff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 1px 8px rgba(0,0,0,0.05);
        transition: all var(--transition);
        display: flex; flex-direction: column;
      }
      .member-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(37,99,235,0.1);
        border-color: rgba(37,99,235,0.2);
      }
      .member-card__photo {
        aspect-ratio: 1;
        background: var(--color-surface-2);
        overflow: hidden;
      }
      .member-card__photo img {
        width: 100%; height: 100%; object-fit: cover;
        transition: transform 0.4s ease;
      }
      .member-card:hover .member-card__photo img { transform: scale(1.04); }
      .member-card__photo-placeholder {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; color: var(--color-muted);
        background: linear-gradient(135deg, var(--color-surface), var(--color-surface-2));
        aspect-ratio: 1;
      }
      .member-card__body {
        padding: 20px 18px;
        display: flex; flex-direction: column; gap: 8px; flex: 1;
      }
      .member-card__name { font-size: 0.95rem; font-weight: 700; color: var(--color-text); }
      .member-card__degree {
        display: inline-flex; align-items: center;
        font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--color-accent);
        background: rgba(37,99,235,0.07); border: 1px solid rgba(37,99,235,0.15);
        padding: 3px 9px; border-radius: 100px; width: fit-content;
      }
      .member-card__topic { font-size: 0.8rem; color: var(--color-muted); line-height: 1.5; flex: 1; }
      .member-card__links { display: flex; gap: 8px; margin-top: 4px; }
      .member-card__link {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border-radius: 6px;
        border: 1px solid var(--color-border); color: var(--color-muted);
        transition: all var(--transition);
      }
      .member-card__link:hover { color: var(--color-accent); border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.05); }
      .member-card__link svg { width: 14px; height: 14px; }
      .member-card__meta {
        display: flex; flex-direction: column; gap: 3px;
        font-size: 0.75rem; color: var(--color-muted);
        border-top: 1px solid var(--color-border);
        padding-top: 8px; margin-top: 6px;
      }
      .member-card__meta-row { display: flex; align-items: flex-start; gap: 5px; line-height: 1.4; }
      .member-card__meta-row svg { width: 11px; height: 11px; flex-shrink: 0; margin-top: 2px; }
      .member-card__meta-row a { color: var(--color-accent); }

      /* ─── ALUMNI SECTION ──────────────────────────────────────── */
      .alumni-section { background: var(--color-surface); padding: 72px 24px; }
      .alumni-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }
      .alumni-item {
        background: #ffffff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        display: flex; align-items: center; gap: 12px;
        transition: all var(--transition);
      }
      .alumni-item:hover { border-color: rgba(37,99,235,0.2); background: rgba(37,99,235,0.02); }
      .alumni-item__photo {
        width: 44px; height: 44px; border-radius: 50%;
        overflow: hidden; flex-shrink: 0;
        background: var(--color-surface-2); border: 1px solid var(--color-border);
      }
      .alumni-item__photo img { width: 100%; height: 100%; object-fit: cover; }
      .alumni-item__photo-placeholder {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem; background: linear-gradient(135deg, var(--color-surface), var(--color-surface-2));
      }
      .alumni-item__info { flex: 1; min-width: 0; }
      .alumni-item__name { font-size: 0.9rem; font-weight: 600; color: var(--color-text); }
      .alumni-item__detail { font-size: 0.78rem; color: var(--color-muted); margin-top: 2px; line-height: 1.4; }
      .alumni-item__year {
        font-size: 0.75rem; font-weight: 700; color: var(--color-muted);
        background: var(--color-surface-2); border: 1px solid var(--color-border);
        padding: 3px 9px; border-radius: 100px; white-space: nowrap; flex-shrink: 0;
      }
      .alumni-item__link {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; border-radius: 6px;
        border: 1px solid var(--color-border); color: var(--color-muted);
        flex-shrink: 0; transition: all var(--transition);
      }
      .alumni-item__link:hover { color: var(--color-accent); border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.05); }
      .alumni-item__link svg { width: 13px; height: 13px; }

      /* ─── FOOTER ──────────────────────────────────────────────── */
      .footer {
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
        padding: 40px 24px;
      }
      .footer__content {
        max-width: 1200px; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;
      }
      .footer__logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; color: var(--color-text); }
      .footer__links { display: flex; gap: 6px; flex-wrap: wrap; }
      .footer__link {
        font-size: 0.8rem; color: var(--color-muted); padding: 5px 10px;
        border-radius: 6px; transition: all var(--transition);
      }
      .footer__link:hover { color: var(--color-text); background: rgba(0,0,0,0.05); }
      .footer__copy { font-size: 0.78rem; color: var(--color-muted); }

      /* ─── FADE IN ─────────────────────────────────────────────── */
      .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.55s ease, transform 0.55s ease; }
      .fade-in.visible { opacity: 1; transform: translateY(0); }

      /* ─── HAMBURGER ─────────────────────────────────────────────── */
      .nav__toggle {
        display: none; flex-direction: column; justify-content: center; gap: 5px;
        background: none; border: none; cursor: pointer;
        padding: 8px; border-radius: var(--radius-sm);
        transition: background var(--transition);
      }
      .nav__toggle:hover { background: rgba(0,0,0,0.05); }
      .nav__toggle span {
        display: block; width: 22px; height: 2px;
        background: var(--color-text); border-radius: 2px;
        transition: all 0.3s ease; transform-origin: center;
      }
      .nav__toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .nav__toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
      .nav__toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      /* ─── RESPONSIVE ──────────────────────────────────────────── */
      @media (max-width: 900px) {
        .pi-card { grid-template-columns: 1fr; gap: 28px; }
        .pi-card__photo { width: 140px; height: 140px; }
      }
      @media (max-width: 768px) {
        .members-grid { grid-template-columns: repeat(2, 1fr); }
        .footer__content { flex-direction: column; align-items: flex-start; }
        .nav__toggle { display: flex; }
        .nav__links {
          display: none; flex-direction: column; gap: 2px;
          position: absolute; top: var(--nav-h); left: 0; right: 0;
          background: rgba(255,255,255,0.97);
          backdrop-filter: blur(16px);
          border-bottom: 1px solid var(--color-border);
          padding: 12px 16px 16px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .nav__links.open { display: flex; }
        .nav__link { padding: 11px 16px; font-size: 0.95rem; width: 100%; }
        .nav__link--cta { background: none; color: var(--color-accent); font-weight: 700; padding: 11px 16px; }
      }
      @media (max-width: 480px) {
        .members-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>

  <body>

    <!-- ── NAV ────────────────────────────────────────────────────── -->
    <nav class="nav">
      <div class="nav__container">
        <a href="../" class="nav__logo">
          <img src="../MISL_black_transparent_simple_pcb_true_mirror_wordmark_only.svg" class="nav__logo-img" alt="MIS Lab logo" />
          MIS Lab
        </a>
        <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav__links">
          <li><a href="../" class="nav__link">Home</a></li>
          <li><a href="../research/" class="nav__link">Research</a></li>
          <li><a href="../people/" class="nav__link nav__link--active">Team</a></li>
          <li><a href="../opening/" class="nav__link">Openings</a></li>
          <li><a href="../teaching/" class="nav__link">Teaching</a></li>
        </ul>
      </div>
    </nav>

    <!-- ── PAGE HEADER ─────────────────────────────────────────────── -->
    <div class="page-header">
      <h1 class="page-header__title">Team</h1>
      <p class="page-header__desc">A multidisciplinary team from mechanical engineering, computer engineering, and data science.</p>
    </div>

    <!-- ── PRINCIPAL INVESTIGATOR ──────────────────────────────────── -->
    <section class="people-section">
      <div class="section-inner" id="pi-container"></div>
    </section>

    <!-- ── CURRENT MEMBERS ─────────────────────────────────────────── -->
    <section class="people-section" id="grad-students">
      <div class="section-inner" id="current-members"></div>
    </section>

    <!-- ── ALUMNI ──────────────────────────────────────────────────── -->
    <section class="alumni-section" id="alumni">
      <div class="section-inner" id="alumni-container"></div>
    </section>

    <!-- ── FOOTER ──────────────────────────────────────────────────── -->
    <footer class="footer">
      <div class="footer__content">
        <a href="../" class="footer__logo">
          <img src="../MISL_black_transparent_simple_pcb_true_mirror_wordmark_only.svg" class="nav__logo-img" alt="MIS Lab logo" />
          MIS Lab
        </a>
        <div class="footer__links">
          <a href="../research/" class="footer__link">Research</a>
          <a href="../people/" class="footer__link">Team</a>
          <a href="../opening/" class="footer__link">Openings</a>
          <a href="https://www.youtube.com/channel/UCh6oN-DiD9h4lSHXrCd7Ccg" target="_blank" class="footer__link">YouTube</a>
          <a href="https://www.uoguelph.ca/engineering/" target="_blank" class="footer__link">College of Engineering</a>
        </div>
        <div class="footer__copy">© 2025 MIS Lab · University of Guelph</div>
      </div>
    </footer>

    <script>
      /* ── SVG icons ─────────────────────────────────────────────── */
      const SVG_EDU    = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10H2"/><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M6 12v7a6 6 0 0 0 12 0v-7"/></svg>`;
      const SVG_EMAIL  = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
      const SVG_CAL    = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
      const SVG_LI     = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`;
      const SVG_GLOBE  = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;

      /* ── Escape HTML special characters in plain text ──────────── */
      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ── Render PI card ─────────────────────────────────────────── */
      function renderPI(pi) {
        const eduHTML = pi.education.map(e =>
          `<div class="pi-card__edu-item"><strong>${esc(e.degree)}</strong> ${esc(e.field)} — ${esc(e.institution)} (${esc(e.years)})</div>`
        ).join('');

        const awardsHTML = pi.awards.map(a =>
          `<div class="pi-card__award-item">${esc(a)}</div>`
        ).join('');

        return `
          <div class="section-divider fade-in">
            <span class="section-divider__title">Principal Investigator</span>
            <div class="section-divider__line"></div>
          </div>
          <div class="pi-card fade-in">
            <div class="pi-card__photo">
              <img src="${esc(pi.photo)}" alt="${esc(pi.name)}" />
            </div>
            <div class="pi-card__main">
              <div>
                <div class="pi-card__name">${esc(pi.name)}</div>
                <div class="pi-card__role">
                  ${esc(pi.role)}
                  <span>${esc(pi.university)}</span>
                </div>
              </div>
              <div class="pi-card__links">
                <a href="${esc(pi.links.profile)}" target="_blank" class="pi-card__link">
                  ${SVG_GLOBE} Guelph Profile
                </a>
                <a href="${esc(pi.links.scholar)}" target="_blank" class="pi-card__link">
                  ${SVG_EDU} Google Scholar
                </a>
                <a href="${esc(pi.links.linkedin)}" target="_blank" class="pi-card__link">
                  ${SVG_LI} LinkedIn
                </a>
                <a href="mailto:${esc(pi.links.email)}" class="pi-card__link">
                  ${SVG_EMAIL} Email
                </a>
              </div>
              <div class="pi-card__edu">${eduHTML}</div>
            </div>
            <div class="pi-card__awards">
              <div class="pi-card__awards-title">Awards &amp; Honors</div>
              ${awardsHTML}
            </div>
          </div>`;
      }

      /* ── Render a single member card ────────────────────────────── */
      function renderMemberCard(m) {
        const photoContent = m.photo
          ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}" />`
          : `<div class="member-card__photo-placeholder">👤</div>`;

        const linkedinBtn = m.linkedin
          ? `<a href="${esc(m.linkedin)}" target="_blank" class="member-card__link" title="LinkedIn">${SVG_LI}</a>`
          : '';

        const emailBtn = m.email
          ? `<a href="mailto:${esc(m.email)}" class="member-card__link" title="Email">${SVG_EMAIL}</a>`
          : '';

        const linksHtml = (linkedinBtn || emailBtn)
          ? `<div class="member-card__links">${linkedinBtn}${emailBtn}</div>`
          : '';

        return `
          <article class="member-card fade-in">
            <div class="member-card__photo">${photoContent}</div>
            <div class="member-card__body">
              <div class="member-card__name">${esc(m.name)}</div>
              <span class="member-card__degree">${esc(m.start)}</span>
              <p class="member-card__topic">${esc(m.topic)}</p>
              <div class="member-card__meta">
                <div class="member-card__meta-row">${SVG_EDU}${esc(m.education)}</div>
                <div class="member-card__meta-row">${SVG_CAL}${esc(m.period)}</div>
              </div>
              ${linksHtml}
            </div>
          </article>`;
      }

      /* ── Render all current member groups ───────────────────────── */
      function renderCurrentMembers(groups) {
        return groups.map(g => {
          const label = g.members.length === 1 ? '1 Member' : `${g.members.length} Members`;
          return `
            <div class="section-divider fade-in">
              <span class="section-divider__title">${esc(g.group)}</span>
              <div class="section-divider__line"></div>
              <span class="section-divider__count">${label}</span>
            </div>
            <div class="members-grid" style="margin-bottom: 48px;">
              ${g.members.map(renderMemberCard).join('')}
            </div>`;
        }).join('');
      }

      /* ── Render a single alumni item ────────────────────────────── */
      function renderAlumniItem(m) {
        const photoContent = m.photo
          ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}" />`
          : `<div class="alumni-item__photo-placeholder">👤</div>`;

        const linkedinBtn = m.linkedin
          ? `<a href="${esc(m.linkedin)}" target="_blank" class="alumni-item__link" title="LinkedIn">${SVG_LI}</a>`
          : '';

        return `
          <div class="alumni-item fade-in">
            <div class="alumni-item__photo">${photoContent}</div>
            <div class="alumni-item__info">
              <div class="alumni-item__name">${esc(m.name)}</div>
              <div class="alumni-item__detail">${esc(m.detail)}</div>
            </div>
            ${linkedinBtn}
            <span class="alumni-item__year">${esc(m.year)}</span>
          </div>`;
      }

      /* ── Render all alumni groups ───────────────────────────────── */
      function renderAlumni(groups) {
        return groups.map((g, i) => `
          <div class="section-divider fade-in">
            <span class="section-divider__title">${esc(g.group)}</span>
            <div class="section-divider__line"></div>
          </div>
          <div class="alumni-grid" style="margin-bottom: ${i < groups.length - 1 ? '40px' : '0'};">
            ${g.members.map(renderAlumniItem).join('')}
          </div>`
        ).join('');
      }

      /* ── Scroll fade-in observer ────────────────────────────────── */
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((el, i) => {
          if (el.isIntersecting) {
            setTimeout(() => el.target.classList.add('visible'), i * 60);
          }
        });
      }, { threshold: 0.08 });

      /* ── Image fallback helper ──────────────────────────────────── */
      function addImageFallbacks() {
        document.querySelectorAll('.member-card__photo img').forEach(img => {
          img.onerror = function () { this.parentElement.innerHTML = '<div class="member-card__photo-placeholder">👤</div>'; };
        });
        document.querySelectorAll('.pi-card__photo img').forEach(img => {
          img.onerror = function () { this.parentElement.innerHTML = '<div class="pi-card__photo-placeholder">👤</div>'; };
        });
        document.querySelectorAll('.alumni-item__photo img').forEach(img => {
          img.onerror = function () { this.parentElement.innerHTML = '<div class="alumni-item__photo-placeholder">👤</div>'; };
        });
      }

      /* ── Fetch data and render page ─────────────────────────────── */
      fetch('../data/people.json')
        .then(r => r.json())
        .then(data => {
          document.getElementById('pi-container').innerHTML      = renderPI(data.pi);
          document.getElementById('current-members').innerHTML   = renderCurrentMembers(data.current);
          document.getElementById('alumni-container').innerHTML  = renderAlumni(data.alumni);

          addImageFallbacks();

          document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        })
        .catch(err => console.error('Failed to load people data:', err));

      /* ── Mobile nav toggle ──────────────────────────────────────── */
      const toggle   = document.querySelector('.nav__toggle');
      const navLinks = document.querySelector('.nav__links');
      toggle.addEventListener('click', () => {
        const open = navLinks.classList.toggle('open');
        toggle.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', open);
      });
      navLinks.querySelectorAll('.nav__link').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('open');
          toggle.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.nav')) {
          navLinks.classList.remove('open');
          toggle.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    </script>

  </body>
</html>
