<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 720" role="img" aria-labelledby="title desc">
  <title id="title">MISL Black Wordmark with Truly Mirrored Simple PCB Circuit I</title>
  <desc id="desc">MISL black wordmark with a top-bottom mirrored simplified PCB circuit-styled I, gear icon, and transparent background for light or white surfaces.</desc>
  <defs>
    <style>
      .black {
        fill: #000000;
      }
      .cyan-stroke {
        fill: none;
        stroke: #2ee8f2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .word {
        fill: #000000;
        font-family: "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
        font-size: 508px;
        font-weight: 900;
        letter-spacing: -18px;
      }
    </style>
  </defs>

  <!-- Transparent background intentionally left empty for use on white/light backgrounds. -->

  <text class="word" x="150" y="635">M</text>

  <g id="true-mirror-simple-pcb-circuit-i" transform="translate(690 137)">
    <g transform="translate(62 76)">
      <g class="black">
        <rect x="-14" y="-75" width="28" height="34" rx="2"/>
        <rect x="-14" y="41" width="28" height="34" rx="2"/>
        <rect x="-75" y="-14" width="34" height="28" rx="2"/>
        <rect x="41" y="-14" width="34" height="28" rx="2"/>
        <rect x="-14" y="-75" width="28" height="34" rx="2" transform="rotate(45)"/>
        <rect x="-14" y="41" width="28" height="34" rx="2" transform="rotate(45)"/>
        <rect x="-75" y="-14" width="34" height="28" rx="2" transform="rotate(45)"/>
        <rect x="41" y="-14" width="34" height="28" rx="2" transform="rotate(45)"/>
        <circle cx="0" cy="0" r="58"/>
      </g>
      <circle cx="0" cy="0" r="31" fill="#ffffff"/>
      <circle class="black" cx="0" cy="0" r="20"/>
      <circle class="cyan-stroke" cx="0" cy="0" r="30" stroke-width="11"/>
    </g>

    <rect class="black" x="0" y="163" width="125" height="334"/>

    <g transform="translate(0 163)">
      <path class="cyan-stroke" d="M32 22V312" stroke-width="5.5"/>
      <path class="cyan-stroke" d="M93 22V312" stroke-width="5.5"/>

      <path class="cyan-stroke" d="M32 96H62.5V142H93" stroke-width="5"/>
      <path class="cyan-stroke" d="M32 238H62.5V192H93" stroke-width="5"/>

      <circle cx="32" cy="96" r="11" fill="#000000" stroke="#2ee8f2" stroke-width="5"/>
      <circle cx="93" cy="142" r="11" fill="#000000" stroke="#2ee8f2" stroke-width="5"/>
      <circle cx="93" cy="192" r="11" fill="#000000" stroke="#2ee8f2" stroke-width="5"/>
      <circle cx="32" cy="238" r="11" fill="#000000" stroke="#2ee8f2" stroke-width="5"/>

      <rect x="24" y="21" width="16" height="16" rx="3" fill="#000000" stroke="#2ee8f2" stroke-width="4"/>
      <rect x="85" y="21" width="16" height="16" rx="3" fill="#000000" stroke="#2ee8f2" stroke-width="4"/>
      <rect x="24" y="297" width="16" height="16" rx="3" fill="#000000" stroke="#2ee8f2" stroke-width="4"/>
      <rect x="85" y="297" width="16" height="16" rx="3" fill="#000000" stroke="#2ee8f2" stroke-width="4"/>
    </g>
  </g>

  <text class="word" x="860" y="635">S</text>
  <text class="word" x="1230" y="635">L</text>
</svg>
